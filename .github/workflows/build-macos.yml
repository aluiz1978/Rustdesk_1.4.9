name: TCE-PE Build - Mac

on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  TAG_NAME: "nightly"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.6"
  UPLOAD_ARTIFACT: "true"

   # --- CONFIGURAÇÕES DO SEU SERVIDOR (HORUS) ---
  
  RENDEZVOUS_SERVER: "horus.tcepe.tc.br"
  RS_PUB_KEY: "NctRD1DQC8cLPTWoUaNGDsF0Flb7TLvusYOOeBSOq6g="
  RELAY_SERVER: "horus.tcepe.tc.br"      # Opcional (se for o mesmo do Rendezvous)
  API_SERVER: "https://horus.tcepe.tc.br" # Opcional (se usarem painel web/API)

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-for-macOS:
    name: Compilar Mac (${{ matrix.job.arch }})
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            arch: x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            arch: aarch64
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: brew install llvm create-dmg pkg-config nasm aom libvmaf

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: rustfmt

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Remover AOM do vcpkg de forma segura
        shell: python
        run: |
          import json, os
          
          if os.path.exists('vcpkg.json'):
              with open('vcpkg.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              if 'dependencies' in data:
                  nova_lista = []
                  for dep in data['dependencies']:
                      if dep == 'aom':
                          continue
                      if isinstance(dep, dict) and dep.get('name') == 'aom':
                          continue
                      nova_lista.append(dep)
                  data['dependencies'] = nova_lista
                  
              with open('vcpkg.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)
              print("--- SUCESSO: AOM removido com segurança do vcpkg.json ---")

      - name: Install vcpkg dependencies
        run: $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"

      - name: Build rustdesk
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix aom)/lib/pkgconfig:$(brew --prefix libvmaf)/lib/pkgconfig:$PKG_CONFIG_PATH"
          export C_INCLUDE_PATH="$(brew --prefix aom)/include:$(brew --prefix libvmaf)/include:$C_INCLUDE_PATH"
          export LIBRARY_PATH="$(brew --prefix aom)/lib:$(brew --prefix libvmaf)/lib:$LIBRARY_PATH"
          
          VCPKG_ARCH=$([[ "${{ matrix.job.target }}" == "aarch64-apple-darwin" ]] && echo "arm64-osx" || echo "x64-osx")
          mkdir -p $VCPKG_ROOT/installed/$VCPKG_ARCH/lib
          mkdir -p $VCPKG_ROOT/installed/$VCPKG_ARCH/include
          
          cp -f $(brew --prefix aom)/lib/libaom.a $VCPKG_ROOT/installed/$VCPKG_ARCH/lib/ || true
          cp -fR $(brew --prefix aom)/include/* $VCPKG_ROOT/installed/$VCPKG_ARCH/include/ || true
          
          cp -f $(brew --prefix libvmaf)/lib/libvmaf.a $VCPKG_ROOT/installed/$VCPKG_ARCH/lib/ || true
          cp -fR $(brew --prefix libvmaf)/include/* $VCPKG_ROOT/installed/$VCPKG_ARCH/include/ || true
          
          export RUSTFLAGS="-L native=$(brew --prefix libvmaf)/lib -l static=vmaf"
          
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste

      - name: create unsigned dmg
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app

      - name: Disponibilizar Instaladores Mac
        uses: actions/upload-artifact@master
        with:
          name: rustdesk-macos-instalador-${{ matrix.job.arch }}-tcepe
          path: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
