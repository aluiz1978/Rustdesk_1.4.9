name: TCE-PE Build - Linux

on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  TAG_NAME: "nightly"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.6"
  UPLOAD_ARTIFACT: "true"

   # --- CONFIGURAÇÕES DO SEU SERVIDOR (HORUS) ---
  
  RENDEZVOUS_SERVER: "horus.tcepe.tc.br"
  RS_PUB_KEY: "NctRD1DQC8cLPTWoUaNGDsF0Flb7TLvusYOOeBSOq6g="
  RELAY_SERVER: "horus.tcepe.tc.br"      # Opcional (se for o mesmo do Rendezvous)
  API_SERVER: "https://horus.tcepe.tc.br" # Opcional (se usarem painel web/API)

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-for-linux:
    name: Compilar Linux
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ gcc git curl wget nasm yasm libgtk-3-dev clang libxcb-randr0-dev libxdo-dev libxfixes-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev libpulse-dev cmake make libwebp-dev libclang-dev pkg-config libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev ninja-build zip unzip tar libpam0g-dev

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Corrigir sintaxe e versoes do vcpkg.json
        shell: python
        run: |
          import json, os
          if os.path.exists('vcpkg.json'):
              with open('vcpkg.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              if 'dependencies' in data:
                  for dep in data['dependencies']:
                      if isinstance(dep, dict):
                          if 'version' in dep:
                              dep['version>='] = dep.pop('version')
                          # Força a versão do libjpeg-turbo para 3.1.1 para evitar erros de versão não encontrada
                          if dep.get('name') == 'libjpeg-turbo' and 'version>=' in dep:
                              dep['version>='] = '3.1.1'
                              
              if 'overrides' in data:
                  for ovr in data['overrides']:
                      if isinstance(ovr, dict) and ovr.get('name') == 'libjpeg-turbo':
                          ovr['version'] = '3.1.1'
                          
              with open('vcpkg.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)
              print("Sintaxe e versões do vcpkg.json corrigidas com sucesso!")

      - name: Install vcpkg dependencies
        run: $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"

      - name: Build rustdesk
        run: |
          python3 ./build.py --flutter --hwcodec

      - name: Disponibilizar Aplicativo Linux
        uses: actions/upload-artifact@master
        with:
          name: rustdesk-linux-tcepe
          path: ./flutter/build/linux/x64/release/bundle/
