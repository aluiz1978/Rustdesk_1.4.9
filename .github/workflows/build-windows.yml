name: TCE-PE Build - Windows

on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  TAG_NAME: "nightly"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4"
  VERSION: "1.4.9"
  UPLOAD_ARTIFACT: "true"

  # --- CONFIGURAÇÕES DO SEU SERVIDOR (HORUS) ---
  RENDEZVOUS_SERVER: "horus.tcepe.tc.br"
  RS_PUB_KEY: "NctRD1DQC8cLPTWoUaNGDsF0Flb7TLvusYOOeBSOq6g="
  RELAY_SERVER: "horus.tcepe.tc.br"
  API_SERVER: "https://horus.tcepe.tc.br"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: Compilar Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Corrigir sintaxe do vcpkg.json
        shell: python
        run: |
          import json, os
          if os.path.exists('vcpkg.json'):
              with open('vcpkg.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              if 'dependencies' in data:
                  for dep in data['dependencies']:
                      if isinstance(dep, dict) and 'version' in dep:
                          dep['version>='] = dep.pop('version')
              with open('vcpkg.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
        shell: bash

      - name: Injeção Cirúrgica TCE-PE (Textos, Cores e Ajustes)
        shell: python
        run: |
          import os
          import re

          print("--- INICIANDO INJEÇÃO DO TCE-PE ---")

          # 1. Configurações de Servidor
          config_path = 'libs/hbb_common/src/config.rs'
          if os.path.exists(config_path):
              with open(config_path, 'r', encoding='utf-8') as f:
                  rust_content = f.read()

              rust_content = re.sub(r'pub const RENDEZVOUS_SERVERS:\s*\&\[\&str\]\s*=\s*\&\[.*?\];', 'pub const RENDEZVOUS_SERVERS: &[&str] = &["${{ env.RENDEZVOUS_SERVER }}"];', rust_content, flags=re.DOTALL)
              rust_content = re.sub(r'pub const RS_PUB_KEY:\s*\&str\s*=\s*".*?";', 'pub const RS_PUB_KEY: &str = "${{ env.RS_PUB_KEY }}";', rust_content)

              busca_rust = r'(pub\s+fn\s+get_option\s*\(\s*([a-zA-Z0-9_]+)\s*:\s*.*?\)\s*->\s*String\s*\{)'
              injecao_rust = (
                  r'\1\n'
                  r'    if \2 == "hide-powered-by-me" { return "Y".to_owned(); }\n'
                  r'    if \2 == "custom-rendezvous-server" { return "${{ env.RENDEZVOUS_SERVER }}".to_owned(); }\n'
                  r'    if \2 == "rendezvous-server" { return "${{ env.RENDEZVOUS_SERVER }}".to_owned(); }\n'
                  r'    if \2 == "relay-server" { return "${{ env.RELAY_SERVER }}".to_owned(); }\n'
                  r'    if \2 == "api-server" { return "${{ env.API_SERVER }}".to_owned(); }\n'
                  r'    if \2 == "key" { return "${{ env.RS_PUB_KEY }}".to_owned(); }'
              )
              rust_content = re.sub(busca_rust, injecao_rust, rust_content)
              
              with open(config_path, 'w', encoding='utf-8') as f:
                  f.write(rust_content)

          # 2. Esconder a frase "Conexão mais rápida"
          connection_page = 'flutter/lib/desktop/pages/connection_page.dart'
          if os.path.exists(connection_page):
              with open(connection_page, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              busca_setup_server = r'setupServerWidget\(\)\s*=>\s*Flexible\([\s\S]*?translate\(\'setup_server_tip\'\)[\s\S]*?\),[\s\S]*?\);'
              content = re.sub(busca_setup_server, r'setupServerWidget() => const Offstage();', content)
              
              with open(connection_page, 'w', encoding='utf-8') as f:
                  f.write(content)

          # 3. Limpar SVG fantasma do pubspec (deixamos sem a logo de imagem agora)
          pubspec_path = 'flutter/pubspec.yaml'
          if os.path.exists(pubspec_path):
              with open(pubspec_path, 'r', encoding='utf-8') as f:
                  pubspec = f.read()
              pubspec = re.sub(r'\s*-\s*assets/logo_tce\.svg', '', pubspec)
              pubspec = re.sub(r'\s*-\s*assets/logo_tce\.png', '', pubspec)
              with open(pubspec_path, 'w', encoding='utf-8') as f:
                  f.write(pubspec)

          # 4. Alterar o Desktop Home Page de forma SEGURA
          home_page = 'flutter/lib/desktop/pages/desktop_home_page.dart'
          if os.path.exists(home_page):
              with open(home_page, 'r', encoding='utf-8') as f:
                  content = f.read()

              # a. Desativar apenas HelpCards (Mantém UAC e Instalação intactos)
              content = re.sub(r'(Widget\s+buildHelpCards[^{]*\{)', r'\1 return const Offstage();', content)

              # b. Isolar apenas o Left Pane
              left_pane_start = content.find('Widget _buildLeftPane')
              if left_pane_start == -1: left_pane_start = content.find('Widget buildLeftPane')
              right_pane_start = content.find('buildRightPane')
              
              if left_pane_start != -1 and right_pane_start != -1:
                  left_pane = content[left_pane_start:right_pane_start]
                  rest_code = content[:left_pane_start] + "___LEFT_PANE_PLACEHOLDER___" + content[right_pane_start:]
                  
                  # Fundo Azul e cores
                  left_pane = left_pane.replace("color: Theme.of(context).colorScheme.background,", "color: const Color(0xFF2B54A1),")
                  left_pane = left_pane.replace("color: Theme.of(context).colorScheme.surface,", "color: const Color(0xFF2B54A1),")
                  left_pane = left_pane.replace("Theme.of(context).textTheme.titleLarge?.color?.withOpacity(0.5)", "Colors.white70")
                  left_pane = left_pane.replace("Theme.of(context).textTheme.titleLarge?.color", "Colors.white")
                  left_pane = left_pane.replace("color: textColor?.withOpacity(0.5)", "color: Colors.white70")
                  left_pane = left_pane.replace("color: textColor", "color: Colors.white")
                  left_pane = left_pane.replace("color: Color(0xFFDDDDDD)", "color: Colors.white54")
                  left_pane = left_pane.replace("color: const Color(0xFFDDDDDD)", "color: Colors.white54")
                  
                  left_pane = left_pane.replace("style: TextStyle(fontSize: 22)", "style: const TextStyle(fontSize: 22, color: Colors.white)")
                  left_pane = left_pane.replace("style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold)", "style: const TextStyle(fontSize: 22, color: Colors.white, fontWeight: FontWeight.bold)")
                  left_pane = left_pane.replace("style: TextStyle(fontSize: 15)", "style: const TextStyle(fontSize: 15, color: Colors.white)")
                  left_pane = left_pane.replace("style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold)", "style: const TextStyle(fontSize: 20, color: Colors.white, fontWeight: FontWeight.bold)")
                  left_pane = left_pane.replace("style: Theme.of(context).textTheme.titleLarge,", "style: Theme.of(context).textTheme.titleLarge?.copyWith(color: Colors.white),")
                  left_pane = left_pane.replace("style: Theme.of(context).textTheme.bodySmall,", "style: Theme.of(context).textTheme.bodySmall?.copyWith(color: Colors.white70),")
                  
                  # c. Remover Tarja Branca/Cinza do ID (Inputs transparentes)
                  left_pane = re.sub(r'color:\s*Theme\.of\(context\)\.colorScheme\.background,?', 'color: Colors.transparent,', left_pane)
                  left_pane = left_pane.replace("border: InputBorder.none, contentPadding: EdgeInsets.only(top: 10, bottom: 10),", "filled: true, fillColor: Colors.transparent, border: InputBorder.none, contentPadding: const EdgeInsets.only(top: 10, bottom: 10),")
                  left_pane = left_pane.replace("border: InputBorder.none, contentPadding: EdgeInsets.only(top: 14, bottom: 10),", "filled: true, fillColor: Colors.transparent, border: InputBorder.none, contentPadding: const EdgeInsets.only(top: 14, bottom: 10),")

                  # d. Remover a "Senha de uso único" e o campo de Senha transformando-os em invisíveis
                  left_pane = re.sub(r'Text\([^)]*translate\(\'One-time password\'\)[^)]*\),?', 'const Offstage(),', left_pane)
                  left_pane = re.sub(r'pwRow,?', 'const Offstage(),', left_pane)
                  left_pane = re.sub(r'buildPwRow\([^)]*\),?', 'const Offstage(),', left_pane)
                  left_pane = re.sub(r'if\s*\(\!hidePw\)\s*(?:const\s+SizedBox\([^)]+\),)?\s*const\s+Offstage\(\),?', '', left_pane)

                  # e. Injetar Texto do TCE-PE no rodapé (Substitui o Expanded vazio)
                  tce_text = "Expanded(child: Align(alignment: Alignment.bottomCenter, child: Padding(padding: const EdgeInsets.only(bottom: 20.0), child: Text('Tribunal de Contas\\nde Pernambuco\\n(TCE-PE)', textAlign: TextAlign.center, style: TextStyle(color: Colors.white70, fontSize: 16, fontWeight: FontWeight.bold)))))"
                  left_pane = left_pane.replace("Expanded(child: Container())", tce_text)

                  content = rest_code.replace("___LEFT_PANE_PLACEHOLDER___", left_pane)

              with open(home_page, 'w', encoding='utf-8') as f:
                  f.write(content)

          # 5. Uniformizar o Azul da Janela
          common_path = 'flutter/lib/common.dart'
          if os.path.exists(common_path):
               with open(common_path, 'r', encoding='utf-8') as f:
                  content = f.read()
               content = content.replace('static const Color accent = Color(0xFF0071FF);', 'static const Color accent = Color(0xFF2B54A1);')
               content = content.replace('static const Color button = Color(0xFF2C8CFF);', 'static const Color button = Color(0xFF2B54A1);')
               content = content.replace('static const Color idColor = Color(0xFF00B6F0);', 'static const Color idColor = Color(0xFF2B54A1);')
               with open(common_path, 'w', encoding='utf-8') as f:
                  f.write(content)

          print("--- INJEÇÃO CONCLUÍDA ---")

      - name: Build rustdesk
        run: |
          python ./build.py --flutter --hwcodec
        shell: bash

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"
          merge-multiple: true

      - name: Preparar arquivos para o Instalador
        shell: bash
        run: |
          mkdir -p ./rustdesk
          cp -r ./flutter/build/windows/x64/runner/Release/* ./rustdesk/
          mv ./rustdesk/rustdesk.exe ./rustdesk/temp.exe
          mv ./rustdesk/temp.exe ./rustdesk/RustDesk.exe

      - name: Build self-extracted executable (.exe)
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/RustDesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build MSI (.msi)
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          mv ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk-${{ env.VERSION }}-x86_64.msi

      - name: Disponibilizar Instaladores Windows
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-windows-tcepe
          path: ./SignOutput/
